server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true

info:
  app:
    name: auth-service
    description: Authentication Service
    version: 1.0.0

logging:
  level:
    root: INFO

app:
  admin-registration-secret: ${ADMIN_REGISTRATION_SECRET:}
  jwt:
    issuer: ${JWT_ISSUER:auth-service}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:5}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}

springdoc:
  swagger-ui:
    config-url: /auth/v3/api-docs/swagger-config
    url: /auth/v3/api-docs
