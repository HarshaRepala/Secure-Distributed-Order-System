server:
  port: ${SERVER_PORT:8083}
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true

info:
  app:
    name: inventory-service
    description: Inventory Service
    version: 1.0.0

logging:
  level:
    root: INFO

springdoc:
  swagger-ui:
    config-url: /inventory/v3/api-docs/swagger-config
    url: /inventory/v3/api-docs