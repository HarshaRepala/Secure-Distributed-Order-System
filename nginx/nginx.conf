events {}

http {

    server_tokens off;

    upstream auth {
        server auth-service:8080;
    }

    upstream order {
        server order-service:8080;
    }

    upstream inventory {
        server inventory-service:8080;
    }

    server {
        listen 80;
        server_name mymicroservices.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name mymicroservices.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/mymicroservices.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mymicroservices.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /auth/ {
            proxy_pass http://auth/;
        }

        location /order/ {
            proxy_pass http://order/;
        }

        location /inventory/ {
            proxy_pass http://inventory/;
        }
    }

}