events {}

http {

    upstream auth {
        server auth-service:8080;
    }

    upstream order {
        server order-service:8080;
    }

    upstream inventory {
        server inventory-service:8080;
    }

    server {

        listen 80;

        ############################
        # AUTH SERVICE
        ############################

        location /auth/ {
            proxy_pass http://auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /auth/v3/api-docs {
            proxy_pass http://auth/v3/api-docs;
        }

        location = /auth/v3/api-docs/swagger-config {
            proxy_pass http://auth/v3/api-docs/swagger-config;
        }

        ############################
        # ORDER SERVICE
        ############################

        location /order/ {
            proxy_pass http://order/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /order/v3/api-docs {
            proxy_pass http://order/v3/api-docs;
        }

        location = /order/v3/api-docs/swagger-config {
            proxy_pass http://order/v3/api-docs/swagger-config;
        }

        ############################
        # INVENTORY SERVICE
        ############################

        location /inventory/ {
            proxy_pass http://inventory/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /inventory/v3/api-docs {
            proxy_pass http://inventory/v3/api-docs;
        }

        location = /inventory/v3/api-docs/swagger-config {
            proxy_pass http://inventory/v3/api-docs/swagger-config;
        }

    }
}