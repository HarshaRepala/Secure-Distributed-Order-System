name: CI/CD - Build, Push and Deploy

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  build-test:
    name: Build & Test - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - inventory-service
          - order-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Java 17
        uses: actions/setup-java@v4.8.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and Test
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          DIR=backend-microservices/$SERVICE

          if [ ! -f "$DIR/pom.xml" ]; then
            echo "pom.xml not found for $SERVICE"
            exit 1
          fi

          mvn -B clean verify -f "$DIR/pom.xml"

  docker-publish:
    name: Build & Push - ${{ matrix.service }}
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - inventory-service
          - order-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Login to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        env:
          SERVICE: ${{ matrix.service }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          DIR=backend-microservices/$SERVICE

          docker build \
            -t $DOCKER_USER/$SERVICE:${GITHUB_SHA} \
            -t $DOCKER_USER/$SERVICE:latest \
            -f "$DIR/Dockerfile" \
            "$DIR"

      - name: Push Docker Image
        env:
          SERVICE: ${{ matrix.service }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker push $DOCKER_USER/$SERVICE:${GITHUB_SHA}
          docker push $DOCKER_USER/$SERVICE:latest   

  deploy:
    name: Deploy to EC2
    needs: docker-publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/app

            git pull origin main

            docker compose -f docker-compose.prod.yml pull --quiet

            docker compose -f docker-compose.prod.yml up -d 

            echo "Waiting for services to start (initial wait 60 seconds)..."
            sleep 60

            docker ps | grep nginx || {
              echo "✗ Nginx container is not running"
              docker compose -f docker-compose.prod.yml ps
              exit 1
            }
            
            wait_for_service() {
              local service_name=$1
              local url=$2
              local max_attempts=10
              local attempt=1
            
              while [ $attempt -le $max_attempts ]; do
                if curl -s -f "$url" > /dev/null 2>&1; then
                  echo "✓ $service_name is healthy"
                  return 0
                fi
            
                echo "  ⏳ Services not ready (attempt $attempt/$max_attempts), retrying in 10s..."
                sleep 10
                attempt=$((attempt + 1))
              done
            
              echo "✗ $service_name failed to become healthy"
              return 1
            }

            wait_for_service "auth-service" "http://localhost/auth/actuator/health" || exit 1
            wait_for_service "order-service" "http://localhost/order/actuator/health" || exit 1
            wait_for_service "inventory-service" "http://localhost/inventory/actuator/health" || exit 1

            docker image prune -af

            docker ps