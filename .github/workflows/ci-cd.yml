name: CI/CD - Build, Push and Deploy

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  build-test:
    name: Build & Test - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - inventory-service
          - order-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and Test
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          DIR=backend-microservices/$SERVICE

          if [ ! -f "$DIR/pom.xml" ]; then
            echo "pom.xml not found for $SERVICE"
            exit 1
          fi

          mvn -B clean verify -f "$DIR/pom.xml"

  docker-publish:
    name: Build & Push - ${{ matrix.service }}
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - inventory-service
          - order-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        env:
          SERVICE: ${{ matrix.service }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          DIR=backend-microservices/$SERVICE

          docker build \
            -t $DOCKER_USER/$SERVICE:latest \
            -t $DOCKER_USER/$SERVICE:${GITHUB_SHA} \
            -f "$DIR/Dockerfile" \
            "$DIR"

      - name: Push Docker Image
        env:
          SERVICE: ${{ matrix.service }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker push $DOCKER_USER/$SERVICE:latest
          docker push $DOCKER_USER/$SERVICE:${GITHUB_SHA}

  deploy:
    name: Deploy to EC2
    needs: docker-publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/app

            git pull origin main

            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml up -d

            echo "Waiting for services to start..."
            sleep 40

            echo "Checking auth-service health..."
            curl -f http://localhost:8081/actuator/health || exit 1

            echo "Checking order-service health..."
            curl -f http://localhost:8082/actuator/health || exit 1

            echo "Checking inventory-service health..."
            curl -f http://localhost:8083/actuator/health || exit 1

            docker image prune -af

            docker ps